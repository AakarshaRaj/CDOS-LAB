<!DOCTYPE html>
<html>
<head>
    <title>Focused Reading</title>
    <style type="text/css">
body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(to right, #eef2f3, #dfe9f3);
    margin: 0;
    padding: 0;
}

/* NAVBAR */
nav {
    background: #2c3e50;
    padding: 15px;
    display: flex;
    justify-content: space-around;
}

nav a {
    color: white;
    font-weight: bold;
    text-decoration: none;
}

nav a:hover {
    color: #1abc9c;
}

/* CONTAINER */
.container {
    width: 60%;
    margin: 40px auto;
    background: white;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0px 4px 15px rgba(0,0,0,0.2);
}

/* FORM */
input, select {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
    border-radius: 5px;
    border: 1px solid #ccc;
}

/* BUTTON */
button {
    background: #1abc9c;
    color: white;
    border: none;
    padding: 10px 20px;
    margin-top: 10px;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background: #16a085;
}

/* TIMER */
#timer {
    font-size: 24px;
    font-weight: bold;
    color: #e74c3c;
    text-align: center;
    margin-top: 20px;
}

/* CARD STYLE */
.card {
    background: #f9f9f9;
    padding: 15px;
    margin-top: 10px;
    border-left: 5px solid #1abc9c;
}
    </style>
</head>
<body>

<nav>
    {% if user.is_authenticated %}
    <a href="{% url 'dashboard' %}">Dashboard</a>
    <a href="{% url 'logout' %}">Logout</a>
    {% else %}
    <a href="{% url 'login' %}">Login</a>
    {% endif %}
</nav>

<hr>

<div class="container">
    {% block content %}{% endblock %}
</div>

</body>
</html>
