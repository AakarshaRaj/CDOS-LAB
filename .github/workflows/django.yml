name: Django CI/CD

on:
  push:
    branches: [reading_branch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.10

    - name: Install Dependencies
      run: |
        pip install -r requirements.txt
        pip install pylint pylint-django

    - name: Run Pylint
      run: pylint --load-plugins pylint_django reading

    - name: Run Tests
      run: python manage.py test
